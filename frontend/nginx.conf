server {
  listen 80;
  root /usr/share/nginx/html;

  # /api/* → backend, with the /api prefix stripped (the trailing slashes do that).
  location /api/ {
    proxy_pass http://app:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Creating a company runs migrations; give it time.
    proxy_read_timeout 180s;
  }

  # Hashed assets never change; cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/admin, /users, ...) all serve index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
